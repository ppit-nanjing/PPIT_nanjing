# Postgres lokal buat `npm run dev`. Hanya untuk mesin sendiri: port sengaja
# diikat ke 127.0.0.1 supaya tidak terbuka ke jaringan. Deployment pribadi di VPS
# terpisah, dengan konfigurasi dan password sendiri. Penjelasan lengkap:
# docs/Database Lokal Docker.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppit}
      POSTGRES_DB: ppit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ppit-lokal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppit -d ppit"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ppit-lokal:
